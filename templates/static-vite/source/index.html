<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Static Vite App</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="bg-gray-100 min-h-screen p-8 text-gray-900">
    <div id="app" class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
      <h1 class="text-2xl font-bold mb-4">Static Vite App</h1>
      <p class="mb-4">This is a neutral browser-only utility.</p>

      <div class="mb-4">
        <label for="data-input" class="block font-medium mb-1">Save data locally:</label>
        <input id="data-input" type="text" class="border rounded p-2 w-full" placeholder="Type something..." />
      </div>
      <button id="save-btn" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>

      <div class="mt-6">
        <h2 class="text-lg font-semibold">Saved Data (localStorage):</h2>
        <p id="saved-data" class="mt-2 text-gray-600 italic">No data saved yet.</p>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
