server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    location = /healthz {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # API should not be swallowed by SPA fallback
    location /api/ {
        return 404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
}
