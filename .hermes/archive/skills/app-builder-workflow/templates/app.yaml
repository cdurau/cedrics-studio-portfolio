# Bounded deployment manifest per templates/CONTRACTS.md (Phase-11)
# Exactly one owner (Orchestrator), derived one-way from app-brief.json
schema: 1
slug: shopping-list
profile: react-hono-sqlite
routing:
  mode: path
database:
  type: sqlite
auth:
  forward_auth: true
  method: authentik-forward-auth
  identity_headers:
    - X-authentik-username
    - X-authentik-email
    - X-authentik-name
    - X-authentik-uid
    - X-authentik-groups
