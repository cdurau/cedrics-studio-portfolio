[project]
name = "obsidian-mcp"
version = "0.2.0"
description = "MCP server for Obsidian vaults (read, search, write, links, tags, daily notes, templates)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
